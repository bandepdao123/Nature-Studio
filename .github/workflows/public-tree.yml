name: Public tree guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate-public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_publication.py --tree HEAD
      - run: python scripts/validate_memory.py
